<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concessions Parking QR Card Generator</title>
    <script>
      (function() {
        try {
          fetch('/api/config')
            .then(function(res) {
              if (!res || !res.ok) {
                console.warn('⚠️ /api/config returned status ' + (res ? res.status : 'unknown') + ', falling back to default/local configuration.');
                return null;
              }
              return res.json().catch(function() { return null; });
            })
            .then(function(data) {
              if (data && data.supabaseUrl && data.supabaseAnonKey) {
                window.__SUPABASE_URL__ = data.supabaseUrl;
                window.__SUPABASE_ANON_KEY__ = data.supabaseAnonKey;
              }
            })
            .catch(function(err) {
              console.warn('⚠️ /api/config fetch error caught, operating in fallback/local mode:', err);
            });
        } catch(e) {
          console.warn('⚠️ Global config initialization exception caught:', e);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23005EB8'/%3E%3Ctext x='20' y='44' font-size='34' fill='white' font-family='Arial' font-weight='bold'%3EP%3C/text%3E%3Crect x='4' y='4' width='10' height='10' fill='white' rx='2'/%3E%3Crect x='50' y='4' width='10' height='10' fill='white' rx='2'/%3E%3Crect x='4' y='50' width='10' height='10' fill='white' rx='2'/%3E%3Crect x='50' y='50' width='10' height='10' fill='white' rx='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
