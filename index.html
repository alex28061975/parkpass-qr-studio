<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient &amp; Visitor Parking Voucher Generator</title>
    <meta name="description" content="A professional and mobile-optimized parking QR card and permit dispatch management portal." />
    <meta property="og:title" content="Patient &amp; Visitor Parking Voucher Generator" />
    <meta property="og:description" content="A professional and mobile-optimized parking QR card and permit dispatch management portal." />
    <script>
      (function() {
        try {
          fetch('/api/config')
            .then(function(res) {
              if (!res || !res.ok) {
                console.warn('⚠️ /api/config returned status ' + (res ? res.status : 'unknown') + ', falling back to default/local configuration.');
                return null;
              }
              return res.json().catch(function() { return null; });
            })
            .then(function(data) {
              if (data && data.supabaseUrl && data.supabaseAnonKey) {
                window.__SUPABASE_URL__ = data.supabaseUrl;
                window.__SUPABASE_ANON_KEY__ = data.supabaseAnonKey;
              }
            })
            .catch(function(err) {
              console.warn('⚠️ /api/config fetch error caught, operating in fallback/local mode:', err);
            });
        } catch(e) {
          console.warn('⚠️ Global config initialization exception caught:', e);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23005EB8'/%3E%3Ccircle cx='64' cy='32' r='7' fill='%23F0F4F9'/%3E%3Ctext x='27' y='46' font-size='40' fill='white' font-family='Arial, sans-serif' font-weight='700' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
